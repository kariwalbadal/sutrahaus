<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter+Tight:wght@300..600&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    background:#ffffff; color:#16132b;
    font-family:"Inter Tight",sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:70px 90px 60px;
  }
  .mark { display:flex; align-items:center; gap:14px; }
  .mark img { height:54px; }
  .mark span { font-size:17px; font-weight:600; letter-spacing:.4em; text-transform:uppercase; transform:translateY(3px); }
  h1 { font-family:"Fraunces",serif; font-weight:340; font-size:72px; line-height:1.05; letter-spacing:-.015em; max-width:13em; }
  h1 em { font-weight:330; color:#312761; }
  .foot { border-top:1px solid #16132b; padding-top:22px; display:flex; justify-content:space-between; font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:#6d6a80; }
</style>
</head>
<body>
  <div class="mark"><img src="../assets/img/sutra-logo.png" alt="Sutra"><span>Haus</span></div>
  <h1>We design the <em>first impression.</em><br>Websites, imagery &amp; film for hotels and modern brands.</h1>
  <div class="foot"><span>sutrahaus.com</span><span>badal@sutrahaus.com</span></div>
</body>
</html>
